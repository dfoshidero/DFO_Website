<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal site of Daniel Favour Oshidero — software engineer and computer scientist. Projects, experience, and ways to get in touch.">
  <link rel="icon" href="./favicon.png">
  <title>DFO</title>

  <!-- Static defaults for crawlers and link previews, which do not run
       JavaScript. DocumentMeta in App.jsx keeps these in step with the CMS
       for everything else. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dfvro.com/">
  <meta property="og:title" content="Daniel Favour Oshidero">
  <meta property="og:description" content="Personal site of Daniel Favour Oshidero — software engineer and computer scientist. Projects, experience, and ways to get in touch.">
  <meta property="og:image" content="https://dfvro.com/favicon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Daniel Favour Oshidero">
  <meta name="twitter:description" content="Personal site of Daniel Favour Oshidero — software engineer and computer scientist. Projects, experience, and ways to get in touch.">
  <meta name="twitter:image" content="https://dfvro.com/favicon.png">

  <!-- Theme bootstrap: keep in sync with getInitialTheme() in src/utils/theme.js -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* ignore */ }
    })();
  </script>

  <style>
    /* This used to hold the page invisible for 1s and then fade for another 1s,
       to hide the latency of fetching content. Content now ships in the bundle
       and is there on first paint, so the wait is dead time. The short delay
       that remains just covers script parse and the font swap. */
    body {
      opacity: 0;
      animation: fadeInAnimation ease 0.4s;
      animation-delay: 0.2s;
      animation-iteration-count: 1;
      animation-fill-mode: forwards;
    }

    html {
      animation: fadeInAnimation ease 1s;
      animation-iteration-count: 1;
      animation-fill-mode: forwards;
    }

    @keyframes fadeInAnimation {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <noscript>You need JavaScript to run this page.</noscript>
  <div id="root"></div>
</body>

</html>
